services:

  nginx:
    image: nginx:latest
    container_name: das-nginx
    restart: unless-stopped
    depends_on:
      - das-app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

  postgres:
    image: postgres:18
    container_name: das-postgres
    restart: unless-stopped

    environment:
      TZ: Asia/Kolkata
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql

  das-app:
    image: alokjha1/document-approval-system:latest
    container_name: das-app
    restart: unless-stopped

    depends_on:
      - postgres

    environment:
      TZ: Asia/Kolkata
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

    expose:
      - "8080"

    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres-data: