server {

    listen 80;

    server_name das-alok.duckdns.org;

    return 301 https://$host$request_uri;

}

server {

    listen 443 ssl http2;

    server_name das-alok.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/das-alok.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/das-alok.duckdns.org/privkey.pem;

    resolver 127.0.0.11 valid=30s;

    location / {

        set $upstream http://das-app:8080;

        proxy_pass $upstream;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

    }

}