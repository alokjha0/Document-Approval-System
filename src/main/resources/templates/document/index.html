<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

	<title>Documents</title>

	<!-- CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

	<!-- JS -->

	<script th:src="@{/ckeditor/ckeditor.js}"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
	</script>

	<link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

	<div th:replace="~{fragments/header :: header('Documents')}">
	</div>

	<div th:replace="~{fragments/toast :: toast}">
	</div>

	<div class="container mt-4">

		<!-- CREATE DOCUMENT -->

		<div class="card shadow mb-4">

			<div class="card-header">

				<h5 class="mb-0">

					<span th:text="${documentDto.id == null}
				 ? 'Create Request'
				 : 'Update Request'">
					</span>

				</h5>

			</div>

			<div class="card-body">

				<form th:action="${documentDto.id == null}
			       ? @{/documents/save}
			       : @{/documents/update/{id}(id=${documentDto.id})}" th:object="${documentDto}" method="post"
					enctype="multipart/form-data">


					<div class="row">

						<!-- Department -->

						<div class="col-md-6 mb-3">

							<label class="form-label">

								Request Department

							</label>

							<select class="form-select" id="departmentDropdown" th:field="*{departmentId}">

								<option value="">

									Select Department

								</option>

								<option th:each="dept : ${departments}" th:value="${dept.id}"
									th:text="${dept.departmentName}">
								</option>

							</select>

							<small class="text-danger" th:if="${#fields.hasErrors('departmentId')}"
								th:errors="*{departmentId}">
							</small>

						</div>

						<!-- Application -->

						<div class="col-md-6 mb-3">

							<label class="form-label">

								Request Type

							</label>

							<select class="form-select" id="applicationDropdown" th:field="*{applicationId}"
								th:attr="data-selected=*{applicationId}">

								<option value="">

									Select Application

								</option>

							</select>

							<small class="text-danger" th:if="${#fields.hasErrors('applicationId')}"
								th:errors="*{applicationId}">
							</small>

						</div>

					</div>

					<div class="row">

						<div class="col-md-12 mb-3">

							<label class="form-label">

								Request Title

							</label>

							<input type="text" class="form-control" th:field="*{title}" placeholder="Enter Title">

							<small class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">
							</small>

						</div>

					</div>

					<div class="row">

						<div class="col-md-12 mb-3">

							<label class="form-label">

								Request Summary

							</label>

							<textarea class="form-control" rows="2" th:field="*{description}"
								placeholder="Enter a brief summary of your request">
                        </textarea>

							<small class="text-danger" th:if="${#fields.hasErrors('description')}"
								th:errors="*{description}">
							</small>

						</div>

					</div>

					<div class="row" th:if="${documentDto.id == null}">

						<div class="col-md-12 mb-3">

							<label class="form-label fw-bold">

								Create Document Using

							</label>
							<div class="form-check">

								<input class="form-check-input" type="radio" id="editorOption"
									th:field="*{documentSource}"
									th:value="${T(com.company.das.common.enums.DocumentSource).EDITOR}">

								<label class="form-check-label" for="editorOption">

									Document Editor

								</label>

							</div>

							<div class="form-check">

								<input class="form-check-input" type="radio" id="uploadOption"
									th:field="*{documentSource}"
									th:value="${T(com.company.das.common.enums.DocumentSource).FILE_UPLOAD}">

								<label class="form-check-label" for="uploadOption">

									<span th:text="${documentDto.id == null}
									          ? 'Upload PDF'
									          : 'Replace PDF'">
									</span>

								</label>

							</div>

						</div>
				</div>
				

			

			<div id="editorSection" th:style="${documentDto.documentSource == T(com.company.das.common.enums.DocumentSource).FILE_UPLOAD}
					                ? 'display:none;'
					                : 'display:block;'">

				<div class="row">

					<div class="col-md-12 mb-3">

						<label class="form-label">

							Document Editor

						</label>

						<textarea id="documentEditor" class="form-control" rows="12" th:field="*{documentContent}"
							placeholder="Compose the complete document here...">
							</textarea>

						<small class="text-danger" th:if="${#fields.hasErrors('documentContent')}"
							th:errors="*{documentContent}">
						</small>

					</div>

				</div>
			</div>


			<div id="uploadSection" th:style="${documentDto.documentSource == T(com.company.das.common.enums.DocumentSource).FILE_UPLOAD}
					                ? 'display:block;'
					                : 'display:none;'">

				<div class="row">

					<div class="col-md-12 mb-3">

						<label class="form-label fw-bold">

							Upload PDF

						</label>

						<!-- Only while editing -->
						<div th:if="${documentDto.id != null}">

							<div class="alert alert-info d-flex justify-content-between align-items-center">

								<span>

									Current PDF is available.
									Upload a new PDF only if you want to replace it.

								</span>

								<a th:href="@{/documents/{id}/pdf/view(id=${documentDto.id})}"
								   target="_blank"
								   class="btn btn-sm btn-outline-primary">

								    View

								</a>

							</div>

						</div>

						<label class="form-label">

							<span th:text="${documentDto.id == null}
					                    ? 'Choose PDF'
					                    : 'Replace PDF (Optional)'">
							</span>

						</label>

						<input type="file" id="uploadedPdf" class="form-control" accept=".pdf"
							th:field="*{uploadedFile}">

						<div class="form-text">

							Only PDF files are allowed.

						</div>

					</div>

				</div>

		</div>
		<div class="row">
			<div class="col-md-2 d-flex align-items-end">

				<button type="submit" class="btn btn-primary w-100">

					Save Draft

				</button>

			</div>

		</div>

		</form>

	</div>
	</div>

	</div>

	<!-- DOCUMENT TABLE -->

	<div class="card shadow">

		<div class="card-header d-flex justify-content-between align-items-center">

			<h5 class="mb-0">

				My Documents

			</h5>

			<form method="get" th:action="@{/documents}" class="d-flex" style="max-width:300px;">

				<input type="text" name="keyword" class="form-control me-2" placeholder="Search Document">

				<button class="btn btn-primary">

					Search

				</button>

			</form>

		</div>

		<div class="card-body table-responsive">

			<table class="table table-bordered table-hover">

				<thead>

					<tr>

						<th>Document No</th>
						<th>Department</th>
						<th>Application</th>
						<th>Title</th>
						<th>Status</th>
						<th>Actions</th>

					</tr>

				</thead>

				<tbody>

					<tr th:each="doc : ${documents}">

						<td th:text="${doc.documentNumber}">
						</td>


						<td th:text="${doc.departmentName}">
						</td>

						<td th:text="${doc.applicationName}">
						<td th:text="${doc.title}">
						</td>
						</td>

						<td>

							<span th:if="${doc.status == 'DRAFT'}" class="badge bg-secondary">

								DRAFT

							</span>

							<span th:if="${doc.status == 'SUBMITTED'}" class="badge bg-primary">

								SUBMITTED

							</span>

							<span th:if="${doc.status == 'UNDER_REVIEW'}" class="badge bg-warning text-dark">

								UNDER REVIEW

							</span>

							<span th:if="${doc.status == 'APPROVED'}" class="badge bg-success">

								APPROVED

							</span>

							<span th:if="${doc.status == 'REJECTED'}" class="badge bg-danger">

								REJECTED

							</span>

							<span th:if="${doc.status == 'ADDITIONAL_INFO_REQUESTED'}" class="badge bg-info text-dark">

								INFO REQUESTED

							</span>

							<span th:if="${doc.status == 'RESUBMITTED'}" class="badge bg-info">

								RESUBMITTED

							</span>

						</td>

						<td>

							<div th:if="${doc.status == 'DRAFT'}">

								<a th:href="@{/documents/edit/{id}(id=${doc.id})}" class="btn btn-warning btn-sm">

									Edit

								</a>

								<a th:href="@{/documents/submit/{id}(id=${doc.id})}" class="btn btn-success btn-sm"
									onclick="return confirm('Submit document?')">

									Submit

								</a>

							</div>
							<div th:unless="${doc.status == 'DRAFT'}">

								<a th:href="@{/documents/view/{id}(id=${doc.id})}" class="btn btn-primary btn-sm">

									View

								</a>

							</div>



						</td>

					</tr>

				</tbody>

			</table>

		</div>

	</div>

	</div>

	<script>

		function loadApplications(departmentId, selectedApplicationId = null) {

			let applicationDropdown =
				document.getElementById("applicationDropdown");

			applicationDropdown.innerHTML =
				'<option value="">Select Application</option>';

			if (!departmentId) {
				return;
			}

			fetch('/applications/by-department/' + departmentId)

				.then(response => response.json())

				.then(data => {

					data.forEach(application => {

						let option =
							document.createElement("option");

						option.value = application.id;

						option.text =
							application.applicationName;

						if (selectedApplicationId &&
							application.id == selectedApplicationId) {

							option.selected = true;
						}

						applicationDropdown.appendChild(option);

					});

				});
		}

		document.getElementById("departmentDropdown")
			.addEventListener("change", function () {

				loadApplications(this.value);

			});


			function toggleDocumentSource() {

			    const editorOption = document.getElementById("editorOption");

			    if (!editorOption) {
			        return;
			    }

			    const editorSelected = editorOption.checked;

			    document.getElementById("editorSection").style.display =
			        editorSelected ? "block" : "none";

			    document.getElementById("uploadSection").style.display =
			        editorSelected ? "none" : "block";
			}

		window.onload = function () {

			let departmentId =
				document.getElementById("departmentDropdown").value;

			let applicationId =
				document.getElementById("applicationDropdown")
					.getAttribute("data-selected");

			if (departmentId) {

				loadApplications(
					departmentId,
					applicationId
				);

			}

			CKEDITOR.replace('documentEditor');

			toggleDocumentSource();

			const editorOption = document.getElementById("editorOption");
			const uploadOption = document.getElementById("uploadOption");

			if (editorOption && uploadOption) {

			    editorOption.addEventListener("change", toggleDocumentSource);
			    uploadOption.addEventListener("change", toggleDocumentSource);

			}

		};


	</script>
</body>

</html>
