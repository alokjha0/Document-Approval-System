<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

	<title>Workflow History</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

	<link rel="stylesheet" th:href="@{/css/workflow-history.css}">

	<style>
		.logout-btn {
			background: transparent;
			border: none;
			cursor: pointer;
			padding: 0;
		}

		.logout-icon {
			width: 28px;
			height: 28px;
			filter: brightness(0) invert(1);
		}
	</style>

</head>

<body>

	<div th:replace="~{fragments/header :: header('Workflow History')}"></div>

	<div class="container my-4">

		<div class="card shadow border-0 mb-4">

			<div class="card-body p-4">

				<h3 class="fw-bold text-primary mb-4">

					<i class="bi bi-clock-history me-2"></i>

					Workflow History

				</h3>

				<div class="row">

					<div class="col-md-4">

						<div class="text-muted small">

							Document Number

						</div>

						<div class="fw-semibold fs-5" th:text="${document.documentNumber}">
						</div>

					</div>

					<div class="col-md-4">

						<div class="text-muted small">
							Current Status
						</div>

						<div class="fw-semibold fs-5" th:text="${document.status}"></div>


					</div>

					<div class="col-md-4">

						<div class="text-muted small">
							Current Stage
						</div>



						<div class="fw-semibold fs-5" th:text="${document.currentStage}"></div>


					</div>

				</div>

			</div>

		</div>

		<div class="timeline">

			<div class="timeline-item" th:each="history : ${workflowHistory}">

				<div class="timeline-icon">

					<i th:class="'bi '+${history.actionIcon}"></i>

				</div>

				<div class="card timeline-card">

					<div class="card-body">

						<div class="d-flex justify-content-between align-items-center">

							<h5 class="fw-bold mb-0">

								<span th:text="${history.actionDisplayName}"></span>

							</h5>



						</div>

						<div class="timeline-date mb-3">

							<i class="bi bi-clock-history me-1"></i>

							<span th:text="${#temporals.format(history.actionTime,'dd MMM yyyy • hh:mm a')}">
							</span>

						</div>

						<div class="d-flex align-items-center mt-3">

							<i class="bi bi-person-circle fs-3 text-primary me-3"></i>

							<div>

								<div class="fw-bold" th:text="${history.performedBy}">
								</div>

								<small class="text-muted" th:text="${history.designation}">
								</small>

							</div>

						</div>

						<div class="comment-box" th:if="${history.comment!=null}">

							<div class="comment-title">

								<i class="bi bi-chat-left-quote-fill me-2"></i>

								Comment

							</div>

							<div class="comment-text" th:text="${history.comment}">

							</div>

						</div>

						<div class="mt-3 text-muted" th:if="${history.remarks!=null}">

							<i class="bi bi-info-circle me-2"></i>

							<span th:text="${history.remarks}">
							</span>

						</div>
						<div class="version-box" th:if="${history.pdfAvailable}">

							<h6 class="fw-bold">

								<i class="bi bi-file-earmark-pdf-fill text-danger me-2"></i>

								Version


								<span th:text="${history.versionNumber}">

								</span>

							</h6>

							<div class="d-flex gap-2 mt-3">

								<a class="btn btn-outline-primary btn-sm" target="_blank"
								th:href="@{/documents/pdf/version/{versionId}/view(versionId=${history.versionId})}">

									<i class="bi bi-eye"></i>

									View PDF

								</a>

								<a class="btn btn-outline-success btn-sm"
									th:href="@{/documents/pdf/version/{versionId}/download(versionId=${history.versionId})}">

									<i class="bi bi-download"></i>

									Download PDF

								</a>

							</div>

						</div>

					</div>

				</div>

			</div>

		</div>

		<a th:href="${backUrl}" class="btn btn-outline-secondary">

			<i class="bi bi-arrow-left me-2"></i>

			Back

		</a>

	</div>

</body>

</html>
